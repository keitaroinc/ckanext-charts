version: 1
groups:
  - annotation: ckanext-charts
    options:
      - key: ckanext.charts.cache_strategy
        description: Charts cache strategy
        default: redis
        editable: true
        validators: OneOf(["file_orc","file_csv","redis"]) charts_strategy_support


      - key: ckanext.charts.redis_cache_ttl
        description: Redis cache TTL
        default: 3600
        editable: true
        type: int
        validators: ignore_missing int_validator is_positive_integer

      - key: ckanext.charts.file_cache_ttl
        description: File cache TTL
        default: 3600
        editable: true
        type: int
        validators: ignore_missing int_validator is_positive_integer

      - key: ckanext.charts.enable_cache
        description: Enable cache
        default: true
        editable: true
        type: bool
        validators: ignore_empty boolean_validator

      - key: ckanext.charts.include_htmx_asset
        description: Include HTMX asset
        default: false
        type: bool
        validators: ignore_empty boolean_validator

      - key: ckanext.charts.reinit_ckan_js_modules
        description: Reinit CKAN JS modules
        editable: true
        default: false
        type: bool
        validators: ignore_empty boolean_validator

      - key: ckanext.charts.allow_anon_building_charts
        description: Allow anonymous users to build charts
        editable: true
        default: false
        type: bool
        validators: ignore_empty boolean_validator

      - key: ckanext.charts.disabled_engines
        description: >-
          Space-separated list of chart engines to exclude from the chart and
          chart builder views, e.g. `chartjs`. A disabled engine disappears
          from the engine dropdown, and views already saved with it stop
          rendering until they are re-saved with an enabled engine.
        editable: true
        default: []
        type: list

      - key: ckanext.charts.disabled_chart_types
        description: >-
          Comma-separated list of chart types to exclude from the chart and
          chart builder views, e.g. `plotly:Choropleth`. Commas are used
          instead of spaces because a type name may contain one, such as
          `Horizontal Bar`. An `engine:type` entry disables the type in that
          engine only, while a bare type name disables it in every engine.
          A disabled type disappears from the chart type dropdown, and views
          already saved with it stop rendering until they are re-saved with an
          enabled type.
        editable: true
        default: ""

      - key: ckanext.charts.max_fetch_size
        description: >-
          Maximum size, in megabytes, of a file that the URL and file system
          fetchers are allowed to download or read. Protects the server from
          memory exhaustion caused by very large or malicious files.
        editable: true
        default: 100
        type: int
        validators: ignore_missing int_validator is_positive_integer
